<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Club Admin Dashboard</title>
   <link rel="stylesheet" href="Club Admin Dashboard.css">
  </head>
  <body>
    <div id="loginSection">
      <form id="loginForm" class="form">
        <p class="form-title">Admin Login</p>
        <div class="input-container">
          <input
            id="username"
            placeholder="Enter username"
            type="text"
            required
          />
        </div>
        <div class="input-container">
          <input
            id="password"
            placeholder="Enter password"
            type="password"
            required
          />
        </div>
        <button class="submit" type="submit">Login</button>
      </form>
    </div>

    <div id="adminSection" style="display: none">
      <h2>Admin Dashboard</h2>
      <div class="admin-section">
        <h3>Add New Content</h3>
        <form id="contentForm">
          <input type="text" id="title" placeholder="Title" required />
          <textarea
            id="description"
            placeholder="Description"
            required
          ></textarea>
          <input type="file" id="imageUpload" accept="image/*" />
          <input type="text" id="successStory" placeholder="Success Story" />
          <button type="submit">Add Content</button>
        </form>
      </div>
      <div id="existingContent"></div>
      <button>
        <a href="Club Public Content.html" target="_blank" style="color: white;">View Public Page</a>
      </button>
    </div>

   
    <script src="Club Admin Dashboard.js"></script>
  </body>
</html>

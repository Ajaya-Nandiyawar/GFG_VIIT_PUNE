<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="video_container">
        <video autoplay loop muted playsinline class="bg_video">
            <source src="assets/backgorund.mp4" type="video/mp4" />
        </video>
    </div>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title text-center">Login</h2>
                        <form id="loginForm">
                            <div class="form-group">
                                <input type="text" class="form-control" id="username" placeholder="Username" required>
                            </div>
                            <div class="form-group">
                                <input type="password" class="form-control" id="password" placeholder="Password" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Login</button>
                        </form>
                        <div class="divider text-center my-3">
                            <span>or</span>
                        </div>
                        <button class="btn btn-danger btn-block" onclick="signInWithGoogle()" id="googleSignIn">
                            <img src="/api/placeholder/18/18" alt="Google logo" class="mr-2" />
                            Sign in with Google
                        </button>
                        <div class="login text-center mt-3">
                            <p>Don't have an account? <a href="register.html">Register here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
    <script type="module" src="firebase.js"></script>       
   
</body>
</html>

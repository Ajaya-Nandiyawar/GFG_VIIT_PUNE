<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="video_container">
        <video autoplay loop muted playsinline class="bg_video">
            <source src="assets/backgorund.mp4" type="video/mp4" />
        </video>
    </div>
    <div class="container">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        
        <div class="divider">
            <span>or</span>
        </div>
        <button class="google-btn" onclick="signInWithGoogle()" id="googleSignIn">
            <img src="/api/placeholder/18/18" alt="Google logo" />
            Sign in with Google
        </button>

        <div class="login">
            <p>Don't have an account? <a href="register.html">Register here</a></p>
        </div>
    </div>
    <script src="login.js"></script>
    <script type="module" src="firebase.js"></script>       
   
</body>
</html>
